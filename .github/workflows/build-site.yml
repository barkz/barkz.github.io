# Rebuild the site after every push to main and commit what changed.
# Write a post or edit a partial, push, and this runs tools/build-site.py,
# commits the generated pages as github-actions[bot] and asks GitHub Pages
# to deploy. Pull afterwards so your copy has the bot's commit.
name: Build site

on:
  push:
    branches: [main]
    paths:
      - "posts/**"
      - "partials/**"
      - "site.json"
      - "tools/build-site.py"
      - "*.html"
  workflow_dispatch:

permissions:
  contents: write  # commit the rebuilt pages
  pages: write     # request a Pages deploy

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Build, commit and push
        id: build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A push can land while this runs; rebuild on top of it and retry.
          for attempt in 1 2 3; do
            git fetch --quiet origin "$GITHUB_REF_NAME"
            git reset --quiet --hard "origin/$GITHUB_REF_NAME"
            python3 tools/build-site.py
            git add -A
            if git diff --cached --quiet; then
              echo "Nothing to rebuild."
              echo "pushed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit --quiet -m "Rebuild site" -m "Generated by tools/build-site.py after $(git log -1 --format=%h HEAD)."
            if git push --quiet origin "HEAD:$GITHUB_REF_NAME"; then
              git log -1 --stat --format="Pushed %h"
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejected; retrying on the latest $GITHUB_REF_NAME."
          done
          exit 1

      - name: Deploy to GitHub Pages
        if: steps.build.outputs.pushed == 'true' && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq .status
