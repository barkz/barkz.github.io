<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Moved · WuBu</title>
<script>
/* Old blog links were post.html?p=topic-YYYY-MM-DD. Each post now has its own page at blog/topic.html. */
(function () {
  var p = new URLSearchParams(location.search).get("p") || "", m = /^([a-z0-9][a-z0-9._-]*)-\d{4}-\d{2}-\d{2}$/.exec(p);
  location.replace(m ? "blog/" + m[1] + ".html" : "blog.html");
})();
</script>
</head>
<body style="background:#0a0a0a;color:#e6def0;font-family:system-ui,sans-serif;padding:40px 20px">
<p>This page has moved. <a href="blog.html" style="color:#c49eef">Go to the blog</a>.</p>
</body>
</html>
